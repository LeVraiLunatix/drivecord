<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Le trajet d'un fichier dans Drivecord : chiffré, découpé, envoyé en parallèle, puis réassemblé et déchiffré au téléchargement">
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6D64F2"/><stop offset="1" stop-color="#C64BF1"/></linearGradient>
    <radialGradient id="bg"><stop offset="0" stop-color="#6D64F2" stop-opacity="0.35"/><stop offset="1" stop-color="#6D64F2" stop-opacity="0"/></radialGradient>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#c9b8ff"/></marker>
    <style>
      text { font-family: "Segoe UI Variable Text", "Segoe UI", Inter, Arial, sans-serif; fill: #f7f5ff; }
      .t { font-weight: 700; font-size: 15px; } .m { fill-opacity: 0.6; font-size: 12.5px; } .k { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill-opacity: 0.45; }
      .flow { stroke: #c9b8ff; stroke-width: 2; fill: none; stroke-dasharray: 6 8; animation: flow 1.4s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .up { offset-path: path("M110 150 H1090"); animation: travel 6s cubic-bezier(.45,0,.55,1) infinite; }
      .down { offset-path: path("M1090 300 H110"); animation: travel 6s 3s cubic-bezier(.45,0,.55,1) infinite; }
      @keyframes travel { 0% { offset-distance: 0%; opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { offset-distance: 100%; opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important; } .up, .down { display: none; } }
    </style>
  </defs>
  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="#08060f"/>
    <ellipse cx="600" cy="220" rx="620" ry="260" fill="url(#bg)"/>

    <text x="40" y="84" class="k">ENVOI</text>
    <path class="flow" d="M110 150 H1090" marker-end="url(#arrow)"/>
    <text x="40" y="236" class="k">TÉLÉCHARGEMENT</text>
    <path class="flow" d="M1090 300 H110" marker-end="url(#arrow)"/>

    <!-- Étapes de l'envoi -->
    <g>
      <rect x="40" y="96" width="150" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <path d="M72 116h26l14 14v42a6 6 0 0 1-6 6H72a6 6 0 0 1-6-6v-50a6 6 0 0 1 6-6z" fill="url(#brand)"/>
      <text x="124" y="140" class="t">Ton fichier</text><text x="124" y="160" class="m">n'importe</text><text x="124" y="176" class="m">quelle taille</text>

      <rect x="300" y="96" width="170" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="320" y="132" width="34" height="28" rx="7" fill="#fff"/><path d="M326 132v-7a11 11 0 0 1 22 0v7" fill="none" stroke="#fff" stroke-width="5"/><circle cx="337" cy="144" r="4" fill="#7a4fe0"/>
      <text x="366" y="138" class="t">Chiffré</text><text x="366" y="158" class="m">sur ton appareil</text><text x="366" y="176" class="m">AES-256-GCM</text>

      <rect x="580" y="96" width="170" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <g fill="#a78bff"><rect x="600" y="122" width="16" height="12" rx="3"/><rect x="620" y="122" width="16" height="12" rx="3" fill="#C64BF1"/><rect x="600" y="138" width="16" height="12" rx="3" fill="#e07cff"/><rect x="620" y="138" width="16" height="12" rx="3"/><rect x="600" y="154" width="16" height="12" rx="3" fill="#C64BF1"/><rect x="620" y="154" width="16" height="12" rx="3" fill="#8a7dff"/></g>
      <text x="648" y="138" class="t">Découpé</text><text x="648" y="158" class="m">en morceaux,</text><text x="648" y="176" class="m">envoyés en parallèle</text>

      <rect x="860" y="96" width="300" height="108" rx="20" fill="#14111f" stroke="url(#brand)" stroke-width="1.5"/>
      <path d="M886 122h40M886 136h40M886 150h40" stroke="#c9b8ff" stroke-width="3" stroke-linecap="round"/>
      <text x="944" y="134" class="t">Via un webhook Discord</text><text x="944" y="154" class="m">sur ton salon, sans quota ;</text><text x="944" y="172" class="m">Discord ne voit que des octets chiffrés</text>
    </g>

    <!-- Étapes du téléchargement -->
    <g>
      <rect x="860" y="246" width="300" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <circle cx="904" cy="300" r="18" fill="none" stroke="#c9b8ff" stroke-width="3"/><path d="M904 290v10l7 5" stroke="#c9b8ff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="936" y="288" class="t">Proxy Drivecord</text><text x="936" y="308" class="m">rafraîchit les liens qui ont</text><text x="936" y="324" class="m">expiré, au moment du téléchargement</text>

      <rect x="580" y="246" width="170" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="600" y="282" width="36" height="36" rx="7" fill="#a78bff"/>
      <text x="648" y="288" class="t">Réassemblé</text><text x="648" y="308" class="m">morceaux vérifiés</text><text x="648" y="324" class="m">et remis dans l'ordre</text>

      <rect x="300" y="246" width="170" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <rect x="320" y="284" width="34" height="28" rx="7" fill="#fff"/><path d="M326 284v-7a11 11 0 0 1 22-4" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/><circle cx="337" cy="296" r="4" fill="#5fe3a9"/>
      <text x="366" y="288" class="t">Déchiffré</text><text x="366" y="308" class="m">sur ton appareil</text><text x="366" y="324" class="m">ou pour un partage</text>

      <rect x="40" y="246" width="150" height="108" rx="20" fill="#14111f" stroke="#fff" stroke-opacity="0.12"/>
      <circle cx="84" cy="300" r="20" fill="#5fe3a9" fill-opacity="0.18"/><path d="M75 300l7 7 12-14" stroke="#5fe3a9" stroke-width="3.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="116" y="292" class="t">Prêt</text><text x="116" y="312" class="m">aperçu, ZIP</text><text x="116" y="328" class="m">ou pellicule</text>
    </g>

    <!-- Paquets qui circulent -->
    <rect class="up" x="-9" y="-6" width="18" height="12" rx="3" fill="#e07cff"/>
    <rect class="down" x="-9" y="-6" width="18" height="12" rx="3" fill="#5fe3a9"/>

    <text x="600" y="396" font-size="12.5" fill-opacity="0.5" text-anchor="middle">Une clé aléatoire par drive, gardée chiffrée sur ton compte · coffre-fort protégé par ton PIN (PBKDF2, 200 000 itérations)</text>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="419" rx="26" fill="none" stroke="#fff" stroke-opacity="0.1"/>
</svg>
